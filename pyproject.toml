[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "assets"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PERF", # perflint
    "RUF",  # ruff-specific
    "BLE",  # flake8-blind-except
]

[tool.ruff.lint.per-file-ignores]
# Maintenance scripts are run by hand and print rather than log.
"scripts/*" = ["T201"]
"tests/*" = ["ARG", "PLR2004"]
