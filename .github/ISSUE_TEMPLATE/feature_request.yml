name: Feature request
description: A change or addition to UrStack
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing on a daily-driver Fedora workstation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What UrStack should do. Prefer something that fits the existing pages (Updates, Apps, Health, Backup) over a new product.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Updates / sources
        - Apps catalog
        - Health
        - Backup / restore
        - Settings / installer
        - GUI / accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Notes
      description: Fedora spin, related tools, or why a new package source is needed.
