# UrStack — default config (shipped)
# Copied on first install to: ~/.config/urstack/config.conf
# Override any key there; 1=on, 0=off

# ── Core (safe for most Fedora desktops) ─────────────────────────────────────
enable_dnf=1
enable_flatpak=1
enable_snap=1
enable_fw=1
# Apply fwupd payloads (needs a reboot). Off by default; you can still tick
# Firmware on the Apply screen for a one-off, or pass --include-firmware with --yes.
apply_fw=0
enable_kernel_prune=1
exclude_discover=1

# ── Optional plugins ─────────────────────────────────────────────────────────
enable_toolbox=0
enable_npm=0
enable_npm_user=0
enable_pip=0
enable_pipx=0
enable_rust=0
enable_cargo=0
enable_node=0
enable_cursor=0
enable_claude=0
enable_supabase=0
enable_jetbrains=0
enable_appimage=0

# Backup / restore module (large; personal workstation tooling)
enable_backup=0

# Backup behaviour (used when enable_backup=1)
# Colon- or comma-separated dirs relative to $HOME (or absolute paths)
backup_project_roots=Documents:Projects:src:Desktop:waydroid_script
# How deep to search each root for git repos (1–6)
backup_project_depth=3
# Also rsync most of ~/.config and ~/.local/share (caches excluded)
backup_full_dotconfig=1

# ── Behaviour ────────────────────────────────────────────────────────────────
keep_kernels=3
# Color scheme: system | light | dark
appearance=system
# Quiet GNOME Software background service when running the GUI updater
quiet_gnome_software=1
# Open UrStack when you log in (writes ~/.config/autostart/urstack.desktop)
autostart=0
# With autostart: run `urstack --check --tray` instead of opening the window
autostart_background=0
# Check for updates as soon as the app window opens (Refresh still works if off)
scan_on_startup=1
# Daily user systemd timer that only checks and notifies (urstack --check)
daily_check=0
# Desktop notifications when updates are found or an apply finishes
notifications=1
