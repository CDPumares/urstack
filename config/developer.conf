# Developer / power-user profile — matches the original workstation script.
# Install with: ./install.sh --user --profile developer

enable_dnf=1
enable_flatpak=1
enable_snap=1
enable_fw=1
apply_fw=0
enable_kernel_prune=1
exclude_discover=1

enable_toolbox=1
enable_npm=1
enable_npm_user=1
enable_pip=1
enable_pipx=1
enable_rust=1
enable_cargo=1
enable_node=1
enable_cursor=1
enable_claude=1
enable_supabase=1
enable_jetbrains=1
enable_appimage=1
enable_backup=1

backup_project_roots=Documents:Projects:src:Desktop:waydroid_script
backup_project_depth=3
backup_full_dotconfig=1

keep_kernels=3
appearance=system
quiet_gnome_software=1
autostart=0
scan_on_startup=1
